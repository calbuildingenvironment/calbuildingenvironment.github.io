<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'">

<title>{{ page.title }} | California Building Environment</title>

<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/hero.webp' | absolute_url }}">
<meta property="og:site_name" content="California Building Environment">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{{ '/assets/images/hero.webp' | absolute_url }}">

<meta name="description" content="{{ page.description }}">
<link rel="icon" href="{{ '/assets/images/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/images/icons/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/images/icons/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<meta name="msapplication-config" content="{{ '/browserconfig.xml' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/modules/base.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/modules/layout.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/modules/components.css' | relative_url }}">

{% if page.schema %}
<script type="application/ld+json">
{{ page.schema }}
</script>
{% endif %}

{% if page.schema_extra %}
<script type="application/ld+json">
{{ page.schema_extra }}
</script>
{% endif %}
</head>

<body>
{% include header.html %}
<main id="main-content">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
